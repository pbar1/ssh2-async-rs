[package]
name = "ssh2-async"
version = "0.0.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Runtime-agnostic async wrapper for ssh2"

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[dependencies]
futures = { version = "0.3", default-features = false, features = ["std"] }
ssh2 = { version = "0.9", default-features = false }
tokio = { version = "1.53.3", optional = true, default-features = false, features = ["macros", "net", "rt"] }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
tokio = { version = "1.53.3", default-features = false, features = ["macros", "net", "rt", "time"] }
socket2 = "0.6"
rand = "0.10"
russh = { version = "0.60", default-features = false, features = ["ring"] }
tokio-stream = { version = "0.1", features = ["net"] }
